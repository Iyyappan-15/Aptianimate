<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Interrupted | Route Not Found</title>
  <style>
    :root {
      --bg-main: #0b0f19;
      --surface: #111827;
      --surface2: #0d111c;
      --border: #1f2937;
      --text: #f8fafc;
      --muted: #9ca3af;
      --violet: #6366f1;
      --primary: #4f46e5;
    }

    /* Responsive Light Mode overrides matching ErrorBoundary */
    @media (prefers-color-scheme: light) {
      :root {
        --bg-main: #f3f4f6;
        --surface: #ffffff;
        --surface2: #f9fafb;
        --border: #e5e7eb;
        --text: #111827;
        --muted: #4b5563;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg-main);
      color: var(--text);
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    .container {
      position: relative;
      z-index: 1;
      background: var(--surface);
      padding: 56px 40px;
      border-radius: 28px;
      border: 1px solid var(--border);
      text-align: center;
      max-width: 540px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .visual-wrapper {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 80px;
      height: 80px;
      margin-bottom: 28px;
      animation: floatY 4s ease-in-out infinite;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 14px;
      letter-spacing: -0.025em;
      color: var(--text);
    }

    .divider {
      width: 48px;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--violet), transparent);
      margin: 0 auto 20px auto;
    }

    p.description {
      font-size: 1.05rem;
      color: var(--muted);
      margin-bottom: 36px;
      line-height: 1.6;
      padding: 0 8px;
    }

    .actions {
      display: flex;
      gap: 16px;
      margin-bottom: 36px;
    }

    .btn-primary {
      flex: 1;
      padding: 16px 24px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--violet) 100%);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }

    .btn-secondary {
      flex: 1;
      padding: 16px 24px;
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 14px;
      font-weight: 600;
      font-size: 0.95rem;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-secondary:hover {
      background: var(--border);
      transform: translateY(-2px);
    }

    /* Details Accordion */
    .accordion {
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      background: var(--surface2);
      text-align: left;
    }

    .accordion-header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      transition: border-color 0.2s;
    }

    .accordion-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .accordion-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
    }

    .accordion-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--muted);
    }

    .chevron {
      transform: rotate(0deg);
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      color: var(--muted);
    }

    .chevron.open {
      transform: rotate(180deg);
    }

    .accordion-content {
      display: none;
      border-top: 1px solid var(--border);
      animation: slideDown 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transform-origin: top;
      position: relative;
    }

    .accordion-content.open {
      display: block;
    }

    .btn-copy {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--muted);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-copy.copied {
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .logs-terminal {
      padding: 20px;
      max-height: 220px;
      overflow-y: auto;
      font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.775rem;
      line-height: 1.6;
      color: #f87171;
      white-space: pre-wrap;
    }

    .logs-terminal strong {
      color: #fca5a5;
    }

    @keyframes floatY {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.15); }
    }

    @keyframes slideDown {
      from { opacity: 0; transform: scaleY(0.95); }
      to { opacity: 1; transform: scaleY(1); }
    }

    /* Scrollbar */
    .logs-terminal::-webkit-scrollbar {
      width: 6px;
    }
    .logs-terminal::-webkit-scrollbar-track {
      background: transparent;
    }
    .logs-terminal::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }
    .logs-terminal::-webkit-scrollbar-thumb:hover {
      background: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Visual: Floating 3D Wireframe Hexagonal Crystal -->
    <div class="visual-wrapper">
      <svg width="80" height="80" viewBox="0 0 80 80">
        <polygon points="40,10 68,26 68,54 40,70 12,54 12,26" fill="none" stroke="var(--violet)" stroke-width="2" stroke-linejoin="round" />
        <polygon points="40,24 60,35 60,55 40,66 20,55 20,35" fill="none" stroke="var(--primary)" stroke-width="1.5" stroke-linejoin="round" opacity="0.7" />
        <line x1="40" y1="10" x2="40" y2="24" stroke="var(--violet)" stroke-width="1.5" />
        <line x1="68" y1="26" x2="60" y2="35" stroke="var(--violet)" stroke-width="1.5" />
        <line x1="68" y1="54" x2="60" y2="55" stroke="var(--violet)" stroke-width="1.5" />
        <line x1="40" y1="70" x2="40" y2="66" stroke="var(--violet)" stroke-width="1.5" />
        <line x1="12" y1="54" x2="20" y2="55" stroke="var(--violet)" stroke-width="1.5" />
        <line x1="12" y1="26" x2="20" y2="35" stroke="var(--violet)" stroke-width="1.5" />
        <circle cx="40" cy="45" r="4" fill="#ef4444" style="animation: pulse 1.5s infinite" />
      </svg>
    </div>

    <h1>System Interrupted</h1>
    <div class="divider"></div>
    <p class="description">
      An unexpected route mismatch was prevented. You can attempt to restore the session or head back to safety.
    </p>

    <!-- Action Buttons -->
    <div class="actions">
      <a href="/#/" class="btn-primary">Restore Session</a>
      <a href="/#/" class="btn-secondary">Safe Dashboard</a>
    </div>

    <!-- Custom Interactive Details Accordion -->
    <div class="accordion">
      <div class="accordion-header" id="accordion-toggle">
        <div class="accordion-header-left">
          <div class="accordion-dot"></div>
          <span class="accordion-title">Diagnostic Logs</span>
        </div>
        <svg class="chevron" id="chevron-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9" />
        </svg>
      </div>

      <div class="accordion-content" id="accordion-content">
        <button class="btn-copy" id="copy-btn">Copy Logs</button>
        <div class="logs-terminal">
          <strong style="color: #fca5a5;">Error trace caught by client router:</strong>
          <br>
          Error: Route Not Found (404)
          <br><br>
          <strong style="color: #fca5a5;">Failed resource locator:</strong>
          <br>
          <span id="failed-url-text"></span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Dynamically display the broken URL path
    const path = window.location.pathname + window.location.search + window.location.hash;
    document.getElementById('failed-url-text').textContent = window.location.origin + path;

    // Accordion interaction
    const toggle = document.getElementById('accordion-toggle');
    const content = document.getElementById('accordion-content');
    const chevron = document.getElementById('chevron-icon');

    toggle.addEventListener('click', () => {
      const isOpen = content.classList.toggle('open');
      chevron.classList.toggle('open', isOpen);
    });

    // Copy function
    const copyBtn = document.getElementById('copy-btn');
    copyBtn.addEventListener('click', () => {
      const errorText = `Error: Route Not Found (404)\n\nFailed resource locator:\n\${window.location.origin + path}`;
      navigator.clipboard.writeText(errorText).then(() => {
        copyBtn.textContent = 'Copied!';
        copyBtn.classList.add('copied');
        setTimeout(() => {
          copyBtn.textContent = 'Copy Logs';
          copyBtn.classList.remove('copied');
        }, 2000);
      });
    });
  </script>
</body>
</html>
